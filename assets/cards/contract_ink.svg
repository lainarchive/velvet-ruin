<svg xmlns="http://www.w3.org/2000/svg" width="256" height="180" viewBox="0 0 256 180">
  <!-- CONTRACT INK - black fountain pen, violet ink, luminous contract seal.
       Palette: pen #0c0b10 / #221e2a, ink #6d4bb4, seal #dd3561, ivory #f0eff2 -->
  <rect width="256" height="180" fill="none"/>
  <!-- contract sheet edge (subtle, off-center) -->
  <path d="M36 150 L196 138 L206 158 L46 170 Z" fill="#efe9dd" fill-opacity="0.12"/>
  <path d="M52 158 L182 148" stroke="#f0eff2" stroke-width="1" stroke-opacity="0.25"/>
  <!-- luminous seal: rings with a soft violet glow -->
  <circle cx="164" cy="76" r="34" fill="#6d4bb4" fill-opacity="0.12"/>
  <circle cx="164" cy="76" r="26" fill="none" stroke="#dd3561" stroke-width="2"/>
  <circle cx="164" cy="76" r="19" fill="none" stroke="#dd3561" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M164 62 L167 71 L177 71 L169 77 L172 87 L164 81 L156 87 L159 77 L151 71 L161 71 Z" fill="#dd3561"/>
  <circle cx="164" cy="76" r="34" fill="none" stroke="#6d4bb4" stroke-width="1.4" stroke-opacity="0.8"/>
  <!-- fountain pen: diagonal, nib touching the seal's lower-left -->
  <path d="M60 158 L138 96" stroke="#0c0b10" stroke-width="10" stroke-linecap="round"/>
  <path d="M60 158 L138 96" stroke="#221e2a" stroke-width="4" stroke-linecap="round"/>
  <path d="M138 96 L154 84 L160 90 L146 102 Z" fill="#0c0b10"/>
  <path d="M154 84 L160 90 L148 100 Z" fill="#f0eff2" fill-opacity="0.9"/>
  <!-- violet ink drop hanging from the nib -->
  <path d="M150 104 C150 112 144 114 144 120 C144 126 149 129 153 127 C158 125 158 118 156 113 C155 109 153 106 150 104 Z" fill="#6d4bb4"/>
  <circle cx="150" cy="121" r="1.6" fill="#f0eff2" fill-opacity="0.7"/>
  <!-- small ink dots trailing -->
  <circle cx="96" cy="138" r="1.8" fill="#6d4bb4" fill-opacity="0.8"/>
  <circle cx="112" cy="126" r="1.3" fill="#6d4bb4" fill-opacity="0.6"/>
</svg>
